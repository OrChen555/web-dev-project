# The database only. The application itself runs with npm start, so that anyone
# reviewing the project can point MONGODB_URI at their own MongoDB instead and
# never install Docker at all.
services:
  mongo:
    image: mongo:7
    container_name: daily-web-mongo
    restart: unless-stopped
    ports:
      # Bound to localhost because this instance runs without authentication.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
